# FinQuery look: dark indigo sidebar, light work area, violet accent (palettes in app/ui.py)
[theme]
base = "light"
primaryColor = "#6366F1"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#1A1745"
secondaryBackgroundColor = "#2A2665"
textColor = "#D4D2F2"

[client]
toolbarMode = "minimal"

[server]
headless = true
maxUploadSize = 30             # MB, same limit as uploads.max_mb in settings.yaml

[browser]
gatherUsageStats = false
