# FinQuery configuration: every tunable setting lives here.
# Environment variables (see .env.example) override the values marked "env".

data:
  raw_dir: data/raw            # downloaded PDFs (not committed)
  eval_dir: data/eval          # dev.jsonl / test.jsonl
  documents_file: data/documents.jsonl   # company, type and period of each document
  processed_dir: data/processed          # parsed pages and chunks (not committed)
  dev_size: 20                 # questions used for tuning; the rest is the held-out test set
  seed: 42                     # makes the dev/test split reproducible
  questions_url: https://huggingface.co/datasets/PatronusAI/financebench/resolve/main/financebench_merged.jsonl
  fallback_questions_url: https://raw.githubusercontent.com/patronus-ai/financebench/main/data/financebench_open_source.jsonl
  fallback_documents_url: https://raw.githubusercontent.com/patronus-ai/financebench/main/data/financebench_document_information.jsonl
  pdf_url: https://raw.githubusercontent.com/patronus-ai/financebench/main/pdfs/{doc_name}.pdf
  documents:                   # 18 documents, 13 companies, 50 FinanceBench questions
    - ULTABEAUTY_2023Q4_EARNINGS
    - MGMRESORTS_2022Q4_EARNINGS
    - AMCOR_2023Q4_EARNINGS
    - PEPSICO_2023Q1_EARNINGS
    - JOHNSON_JOHNSON_2022Q4_EARNINGS
    - JOHNSON_JOHNSON_2023_8K_dated-2023-08-30
    - BESTBUY_2024Q2_10Q
    - Pfizer_2023Q2_10Q
    - AMD_2022_10K
    - BOEING_2022_10K
    - AMCOR_2023_10K
    - BESTBUY_2023_10K
    - AMAZON_2017_10K
    - AMAZON_2019_10K
    - NETFLIX_2015_10K
    - NETFLIX_2017_10K
    - COSTCO_2021_10K
    - NIKE_2019_10K

chunking:
  max_words: 150               # chunks never cross a page; split on line boundaries
  overlap_words: 30

embedding:
  model: BAAI/bge-small-en-v1.5       # 384 dimensions, max 512 tokens, ~130 MB
  query_prefix: "Represent this sentence for searching relevant passages: "  # bge instruction, queries only
  batch_size: 32
  device: cpu

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2   # ~90 MB, reads question + chunk together
  batch_size: 16
  device: cpu

retrieval:
  candidates: 20               # chunks taken from dense and from BM25, fused, then reranked
  rrf_k: 60                    # Reciprocal Rank Fusion constant: 1 / (rrf_k + rank)
  top_k: 4                     # chunks sent to the LLM

llm:
  model: openai/gpt-oss-120b   # Groq; API key in GROQ_API_KEY (env)
  fallback_models:             # used by the app when the main model hits its DAILY limit
    - openai/gpt-oss-20b       # (Groq counts daily tokens per model). Evaluations never fall back.
  judge_model: openai/gpt-oss-20b  # another model: its own daily quota, and less self-preference
  temperature: 0
  max_retries: 10              # the Groq SDK waits and retries on rate limits (HTTP 429)
  pause_seconds: 2             # pause between calls in evaluation scripts

generation:
  retrieval_mode: hybrid_rerank
  context_mode: window         # chunks | window (chunk + neighbours, one passage per page) | page
  neighbours: 1                # window mode: chunks added before and after each retrieved chunk

agent:
  max_steps: 6                 # model turns with tool calls before the agent must answer
  passages_per_search: 2       # pages returned by one search_filings call
  max_chars_per_search: 4000   # text returned by one search (~1,100 tokens)
  max_total_chars: 16000       # all searches of one question: keeps every request under ~6,000 tokens
                               # (Groq free tier: 8,000 tokens per minute for gpt-oss-20b)

uploads:                       # documents added by the user in the app
  dir: data/uploads            # files, pages, chunks and catalog (not committed)
  collection: finquery_uploads # separate from the benchmark collection
  max_mb: 30

logging:
  path: data/logs/queries.jsonl  # one line per question / upload (latency, tokens, refusals...)

vector_store:
  collection: finquery
  local_path: data/qdrant      # local mode (no server) when QDRANT_URL is not set
  url: null                    # env QDRANT_URL, e.g. http://qdrant:6333 in Docker Compose
