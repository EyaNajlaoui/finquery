name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Light dependencies only: tests never download a model (Qdrant runs in memory)
      - run: pip install pyyaml numpy qdrant-client rank-bm25 -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
