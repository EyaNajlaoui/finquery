name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only light dependencies: the tested modules do not load any model
      - run: pip install pyyaml -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
