[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finquery"
version = "0.1.0"
description = "Question answering over financial filings with RAG"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set so results do not change with the ruff version
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These entry points add src/ to sys.path before importing finquery
"app/**" = ["E402"]
"scripts/**" = ["E402"]
