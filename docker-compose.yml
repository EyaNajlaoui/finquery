services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data            # PDFs and evaluation files stay on your machine
      - hf_cache:/root/.cache/huggingface   # models are downloaded once
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
  hf_cache:
