# FinQuery look: calm finance palette, teal accent
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F7"
textColor = "#0F172A"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
maxUploadSize = 30             # MB, same limit as uploads.max_mb in settings.yaml

[browser]
gatherUsageStats = false
